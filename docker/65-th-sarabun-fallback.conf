<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fallback for the Thai government fonts used by the forms.
  If the real TH SarabunIT๙ / TH Sarabun New files are installed (from fonts/),
  they win; otherwise Laksaman (TLWG, metric-compatible with TH Sarabun New) is used
  so the PDF layout still matches Word.
-->
<fontconfig>
  <alias binding="same"><family>TH SarabunIT๙</family><accept><family>Laksaman</family></accept></alias>
  <alias binding="same"><family>TH SarabunIT9</family><accept><family>Laksaman</family></accept></alias>
  <alias binding="same"><family>TH Sarabun New</family><accept><family>Laksaman</family></accept></alias>
  <alias binding="same"><family>TH SarabunPSK</family><accept><family>Laksaman</family></accept></alias>
</fontconfig>
