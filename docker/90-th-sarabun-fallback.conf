<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fallback for the Thai government fonts used by the forms (TH SarabunIT๙ / TH Sarabun New).

  * Real fonts installed from fonts/ always win (exact family match).
  * Otherwise use "Sarabun Compat" = Laksaman (TLWG) with its glyphs shrunk to TH Sarabun's
    size, built by tools/make_fallback_font.py. TLWG's own 89-tlwg-laksaman-synthetic.conf
    maps TH Sarabun to Laksaman with a 0.66 matrix, but LibreOffice ignores fontconfig
    matrices, so PDFs came out ~1.5x too wide (labels wrapped, summons spilled to 2 pages).
  * This file is numbered 90 so it runs after TLWG's 89 file: "append" puts Sarabun Compat
    right after the requested family, i.e. before Laksaman.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family" compare="contains"><string>TH Sarabun</string></test>
    <edit name="family" mode="append" binding="same"><string>Sarabun Compat</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>TH SarabunIT9</string></test>
    <edit name="family" mode="append" binding="same"><string>Sarabun Compat</string></edit>
  </match>
</fontconfig>
