{% load thai %}{# params: chart, title_id #}
<div class="relative">
  {% if chart.empty %}<div class="flex h-40 items-center justify-center text-sm text-slate-400">ไม่มีข้อมูลในช่วงนี้</div>{% else %}
  <svg viewBox="0 0 {{ chart.w }} {{ chart.h }}" class="block h-auto w-full" role="img" aria-labelledby="{{ title_id }}">
    {% for g in chart.grid %}
    <line x1="{{ chart.pad_l }}" x2="{{ chart.right }}" y1="{{ g.y }}" y2="{{ g.y }}" stroke="var(--grid)" stroke-width="1" {% if not forloop.first %}stroke-dasharray="2 3"{% endif %}/>
    <text x="{{ chart.pad_l|add:'-6' }}" y="{{ g.y }}" dy="4" text-anchor="end" font-size="11" fill="var(--text-muted)">{{ g.v }}</text>
    {% endfor %}
    {% for b in chart.bars %}
    <g class="viz-day" data-date="{{ b.date|thai_date:'full' }}" data-values="{% for label, color, n in b.values %}{{ label }}|{{ color }}|{{ n }}{% if not forloop.last %};{% endif %}{% endfor %}">
      <rect x="{{ b.x }}" y="0" width="{{ b.w }}" height="{{ chart.base_y }}" fill="transparent" class="viz-hit"/>
      {% for s in b.segs %}<rect x="{{ s.x }}" y="{{ s.y }}" width="{{ s.w }}" height="{{ s.h }}" rx="2" fill="{{ s.color }}"/>{% endfor %}
    </g>
    {% endfor %}
    {% for t in chart.ticks %}<text x="{{ t.x }}" y="{{ chart.h|add:'-8' }}" text-anchor="middle" font-size="11" fill="var(--text-muted)">{{ t.label }}</text>{% endfor %}
  </svg>
  <div class="viz-tip pointer-events-none absolute z-10 hidden min-w-[9rem] rounded-lg bg-white px-3 py-2 text-xs shadow-lg ring-1 ring-slate-200"></div>
  {% endif %}
</div>
