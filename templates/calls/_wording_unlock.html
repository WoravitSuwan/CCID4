{% load ui %}{# params: w = the wording; the button that opens it for editing #}
<form method="post" class="ml-auto" data-no-busy onsubmit="return confirm('ปลดล็อกเพื่อแก้รูปแบบ{{ w.title }}?\nข้อความที่แก้จะใช้ทุกวัน รวมถึงข้อความที่ส่งเข้า LINE')">{% csrf_token %}
  <input type="hidden" name="action" value="template_unlock"><input type="hidden" name="which" value="{{ w.kind }}">
  <button class="btn btn-ghost btn-sm text-slate-600">{% icon "lock-open" "h-4 w-4" %} ปลดล็อกเพื่อแก้รูปแบบ</button>
</form>
