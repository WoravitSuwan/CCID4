{% load humanize thai %}{# params: sankey, link_to_calls (stats page: links open the call list) #}
<style>
  .sankey { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --plain-node: #64748b; --muted-node: #cbd5e1;
            --text-muted: #64748b; }
  .sankey-link { opacity: .22; transition: opacity .15s; }
  .sankey a:hover .sankey-link, .sankey-link:hover { opacity: .42; }
  .sankey-node rect { transition: filter .15s; }
  .sankey-node:hover rect, .sankey-node.is-active rect { filter: brightness(.88); }
  .sankey-node.is-active .sankey-name { text-decoration: underline; }
  .sankey-label { paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .sankey-name { font-size: 14px; font-weight: 600; fill: #0f172a; }
  .sankey-num { font-size: 13px; fill: #334155; } .sankey-pct { font-size: 12px; fill: #64748b; }
</style>
{% if sankey.empty %}<div class="py-10 text-center text-sm text-slate-400">ยังไม่มีข้อมูล</div>{% else %}
<div class="overflow-x-auto">
<svg viewBox="-2 -2 {{ sankey.w|add:'4' }} {{ sankey.h|add:'4' }}" class="sankey block h-auto w-full min-w-[680px]" role="img" aria-label="ภาพรวมการโทรและการออกหมาย แบบ Sankey">
  {% for l in sankey.links %}
  <a href="{% if link_to_calls %}{% url 'calls_queue' %}?scope=all&tab={{ l.key }}{% else %}?{% query_replace tab=l.key page='' %}{% endif %}">
    <path d="{{ l.d }}" fill="{{ l.color }}" class="sankey-link"><title>{{ l.label }}: {{ l.n|intcomma }} คดี</title></path>
  </a>
  {% endfor %}
  {% for n in sankey.nodes %}
  <a href="{% if link_to_calls %}{% url 'calls_queue' %}?scope=all&tab={{ n.key }}{% else %}?{% query_replace tab=n.key page='' %}{% endif %}" class="sankey-node{% if n.key == tab %} is-active{% endif %}">
    <title>{{ n.full_label }}: {{ n.n|intcomma }} คดี ({{ n.pct }}% ของทั้งหมด) — กดเพื่อดูรายการ</title>
    <rect x="{{ n.x }}" y="{{ n.y }}" width="{{ n.w }}" height="{{ n.h }}" rx="3" fill="{{ n.color }}"/>
    <text x="{{ n.lx }}" y="{{ n.ly }}" class="sankey-label"><tspan class="sankey-name">{{ n.label }}</tspan><tspan x="{{ n.lx }}" dy="17" class="sankey-num">{{ n.n|intcomma }} คดี</tspan>{% if n.key != "all" %}<tspan class="sankey-pct"> · {{ n.pct }}%</tspan>{% endif %}</text>
  </a>
  {% endfor %}
</svg>
</div>
{% endif %}
