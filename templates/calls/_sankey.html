{% load humanize thai %}{# params: sankey, link_to_calls (stats page: links open the call list) #}
{% if sankey.empty %}<div class="py-10 text-center text-sm text-slate-400">ยังไม่มีข้อมูล</div>{% else %}
<div class="sankey-wrap relative overflow-x-auto" data-sankey>
<svg viewBox="-2 -2 {{ sankey.w|add:'4' }} {{ sankey.h|add:'4' }}" class="sankey block h-auto w-full min-w-[680px]" role="img" aria-label="ภาพรวมการโทรและการออกหมาย แบบ Sankey">
  <defs>
    {# one colour pair per meaning: light at the top of a bar, deeper below #}
    <linearGradient id="sk-good" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1f4b9a"/></linearGradient>
    <linearGradient id="sk-drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="sk-done" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="sk-plain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <linearGradient id="sk-muted" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="sk-neutral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a64b1"/><stop offset="1" stop-color="#122852"/></linearGradient>
    {# each band fades from its source's colour into its target's #}
    {% for l in sankey.links %}
    <linearGradient id="sk-l{{ forloop.counter }}" gradientUnits="userSpaceOnUse" x1="{{ l.x0 }}" y1="0" x2="{{ l.x1 }}" y2="0">
      <stop offset="0" class="sk-stop-{{ l.from_tone }}"/><stop offset="1" class="sk-stop-{{ l.to_tone }}"/>
    </linearGradient>
    {% endfor %}
    <filter id="sk-glow" x="-60%" y="-10%" width="220%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2.2" flood-color="#0b1a36" flood-opacity=".28"/></filter>
  </defs>
  <g class="sankey-links">
  {% for l in sankey.links %}
  <a href="{% if link_to_calls %}{% url 'calls_queue' %}?tab={{ l.key }}{% else %}?{% query_replace tab=l.key page='' %}{% endif %}"
     class="sankey-band" data-sk-tip="{{ l.label }}" data-sk-n="{{ l.n|intcomma }}" data-sk-pct="{{ l.pct }}" data-sk-ends="{{ l.from }} {{ l.to }}"
     style="--i: {{ forloop.counter0 }}">
    <path d="{{ l.d }}" fill="url(#sk-l{{ forloop.counter }})" class="sankey-link"><title>{{ l.label }}: {{ l.n|intcomma }} คดี</title></path>
    <path d="{{ l.flow }}" class="sankey-flow" stroke-width="{{ l.flow_w }}"/>
  </a>
  {% endfor %}
  </g>
  {% for n in sankey.nodes %}
  <a href="{% if link_to_calls %}{% url 'calls_queue' %}?tab={{ n.key }}{% else %}?{% query_replace tab=n.key page='' %}{% endif %}" class="sankey-node{% if n.key == tab %} is-active{% endif %}"
     data-sk-tip="{{ n.full_label }}" data-sk-n="{{ n.n|intcomma }}" data-sk-pct="{% if n.key != 'all' %}{{ n.pct }}{% endif %}" data-sk-key="{{ n.key }}">
    <title>{{ n.full_label }}: {{ n.n|intcomma }} คดี ({{ n.pct }}% ของทั้งหมด) — กดเพื่อดูรายการ</title>
    <rect x="{{ n.x }}" y="{{ n.y }}" width="{{ n.w }}" height="{{ n.h }}" rx="4" fill="url(#sk-{{ n.tone }})" filter="url(#sk-glow)"/>
    <text x="{{ n.lx }}" y="{{ n.ly }}" class="sankey-label"><tspan class="sankey-name">{{ n.label }}</tspan><tspan x="{{ n.lx }}" dy="17" class="sankey-num">{{ n.n|intcomma }} คดี</tspan>{% if n.key != "all" %}<tspan class="sankey-pct"> · {{ n.pct }}%</tspan>{% endif %}</text>
  </a>
  {% endfor %}
</svg>
<div class="sankey-tip" role="tooltip" hidden></div>
</div>
{% endif %}
