{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card">
  <h1 class="mb-4">เปลี่ยนรหัสผ่าน</h1>
  <form method="post" class="space-y-3">{% csrf_token %}
    {% for f in form %}<div><label class="label">{{ f.label }}</label><input class="input" type="password" name="{{ f.html_name }}" required>{{ f.errors }}</div>{% endfor %}
    <button class="btn btn-primary">บันทึก</button>
  </form>
</div>
{% endblock %}
